services:
  backend:
    image: mjduleba/portfolio-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"

  frontend:
    image: mjduleba/portfolio-frontend:latest
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
